name: ci

# 只跑不需要真机的部分：两个包的离线自测 + 样例数据校验。

on:
  push:
    branches: [main]
  pull_request:

# 最小权限：这个工作流只读代码，不需要写令牌
permissions:
  contents: read

jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.11"

      - name: 安装依赖（视觉通道与媒体工具需要 numpy/Pillow）
        run: pip install -r requirements.txt

      - name: lint 离线自测（夹具断言）
        run: python lint/tests/selftest.py

      - name: 生成样例数据
        run: |
          python lint/collectors/adb_collect.py --fixture lint/fixtures/normal.xml --out lint/data/ci.jsonl
          python lint/collectors/adb_collect.py --fixture lint/fixtures/orphan.xml --out lint/data/ci.jsonl

      - name: schema 校验
        run: python lint/tests/schema_check.py lint/data/ci.jsonl

      - name: 隐私扫描（确认无界面文本）
        run: python lint/tests/privacy_scan.py lint/data/ci.jsonl

      - name: 分析器冒烟
        run: python lint/analyze/analyze.py lint/data/ci.jsonl --outdir lint/data

      - name: engine 离线自测
        run: python engine/tests/selftest_engine.py

      - name: CLI 契约（非法输入必须按退出码失败）
        run: python engine/tests/test_cli.py

      - name: 输入契约（空/损坏数据集必须失败）
        run: python lint/tests/test_inputs.py

      - name: 前台契约（系统弹窗可退，真实应用不退，启动会重试）
        run: python uiauto/tests/test_uiauto.py

      - name: 采集锁契约（同一输出文件只允许一个写者）
        run: python lint/tests/test_lock.py

      - name: 截图哈希契约（按像素而非 PNG 字节）
        run: python engine/tests/test_screen_hash.py

      - name: CLI 冒烟（每个入口 --help 必须正常）
        run: python tools/check_cli.py

      - name: Runner 契约（假 adb：等待、点击、dry-run、变更检测）
        run: python engine/tests/test_runner.py